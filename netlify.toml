[build]
  # Giao diện Netlify nằm trong netlify-web/, ảnh sản phẩm lấy từ wwwroot/ (không sửa code gốc)
  publish = "dist"
  command = "rm -rf dist && mkdir -p dist && cp -r netlify-web/. dist/ && cp -r wwwroot/images wwwroot/favicon.ico dist/"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Trang đẹp không đuôi .html
[[redirects]]
  from = "/admin/*"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/app/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
